<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>마흔, 우리 다시 모이자</title>
<meta property="og:type" content="website">
<meta property="og:title" content="마흔, 우리 다시 모이자">
<meta property="og:description" content="초대합니다">
<meta property="og:image" content="https://kyubaek-yoon.github.io/40th-Friends/invitation/img/cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#264234; --board-2:#2d4c3c; --chalk:#f4f2e8; --chalk-dim:#c9d1c8;
    --yellow:#ecd66e; --wood:#7a5234; --wood-2:#966844;
    --paper:#fbfbf7; --ink:#24302a; --ink-soft:#5b665f; --rule:#dfe6ee; --margin:#e9a9a9;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:17px;line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .pen{font-family:"Nanum Pen Script","Gaegu",cursive;font-weight:400}

  /* 칠판 */
  .board{position:relative;background:
      radial-gradient(ellipse 60% 30% at 25% 30%,rgba(255,255,255,.06),transparent 70%),
      radial-gradient(ellipse 40% 25% at 70% 70%,rgba(255,255,255,.05),transparent 70%),
      linear-gradient(160deg,var(--board-2),var(--board));
    border:14px solid var(--wood);border-bottom-width:0;color:var(--chalk);
    padding:28px 24px 0}
  .board-inner{max-width:880px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start;min-height:360px}
  .headline{padding-top:12px}
  .headline h1{margin:0;font-size:clamp(88px,22vw,180px);line-height:.95;letter-spacing:-.01em}
  .headline p{margin:.25em 0 0;font-size:clamp(38px,9vw,64px);line-height:1.1}
  .underline{display:block;height:4px;width:min(420px,80%);margin-top:14px;background:var(--yellow);
    border-radius:2px;transform:rotate(-.6deg);opacity:.9}
  .side{border-left:2px solid rgba(201,209,200,.55);padding:8px 0 24px 20px;font-size:28px;line-height:1.35;min-width:150px}
  .side .date{color:var(--yellow);font-size:32px}
  .side .duty{margin-top:28px;color:var(--chalk)}
  .tray{height:30px;background:var(--wood);border-top:5px solid var(--wood-2);position:relative;margin:0 -24px}
  .tray span{position:absolute;bottom:22px;height:10px;border-radius:4px}
  .tray .c1{right:190px;width:56px;background:var(--chalk)}
  .tray .c2{right:120px;width:52px;background:var(--yellow)}
  .tray .er{right:24px;width:76px;height:20px;border-radius:3px;background:linear-gradient(#463e50 60%,#c8c8c8 60%)}

  /* 판서 등장 */
  .write{clip-path:inset(0 100% 0 0);animation:write 1.1s ease-out forwards}
  .write.d2{animation-delay:.55s}
  .underline.write{animation-delay:1.2s;animation-duration:.6s}
  @keyframes write{to{clip-path:inset(0 0 0 0)}}
  @media (prefers-reduced-motion:reduce){.write{animation:none;clip-path:none}}

  /* 공책 */
  main{max-width:640px;margin:0 auto;padding:44px 24px 64px;
}
  .letter{font-size:18px;line-height:1.85;margin:0 0 44px;padding-bottom:36px;border-bottom:1px solid var(--rule)}
  .letter p{margin:0}
  h2{font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:34px;line-height:1.2;margin:0 0 14px;color:var(--ink)}
  dl{margin:0 0 44px;display:grid;grid-template-columns:72px 1fr;row-gap:12px;column-gap:16px}
  dt{color:var(--ink-soft)}
  dd{margin:0}
  .note{display:block;color:var(--ink-soft);font-size:15px}
  a{color:#2e6a4e;text-underline-offset:3px}
  .account{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  button,.btn{font:inherit;cursor:pointer;border-radius:6px}
  .copy{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:2px 12px;font-size:15px}
  .copy:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--board);color:var(--chalk);
    padding:14px 18px;font-size:18px;margin:8px 0 44px;border:0}
  .btn:hover{background:var(--board-2)}
  footer{text-align:center;color:var(--ink-soft);font-size:15px;padding:0 24px 40px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:600px){
    .board{border-width:10px;border-bottom-width:0;padding:20px 18px 0}
    .board-inner{grid-template-columns:1fr;gap:4px;min-height:0}
    .side{border-left:0;border-top:2px solid rgba(201,209,200,.55);padding:12px 0 22px;display:flex;justify-content:space-between;align-items:baseline;font-size:24px}
    .side .date{font-size:26px}
    .side .duty{margin-top:0}
    .tray{margin:0 -18px}
    dl{grid-template-columns:60px 1fr}
  }
</style>
</head>
<body>

<header class="board">
  <div class="board-inner">
    <div class="headline pen">
      <h1 class="write">마흔,</h1>
      <p class="write d2">우리 다시 모이자</p>
      <span class="underline write" aria-hidden="true"></span>
    </div>
    <div class="side pen">
      <div class="date" id="boardDate"></div>
      <div class="duty">주번 <span id="host"></span></div>
    </div>
  </div>
  <div class="tray" aria-hidden="true"><span class="c1"></span><span class="c2"></span><span class="er"></span></div>
</header>

<main>
  <section class="letter" id="letter"></section>

  <h2>언제, 어디서</h2>
  <dl>
    <dt>날짜</dt><dd id="date"></dd>
    <dt>시간</dt><dd id="time"></dd>
    <dt>장소</dt><dd><span id="place"></span><span class="note" id="address"></span><a id="map" target="_blank" rel="noopener">지도 보기</a></dd>
  </dl>

  <div id="feeBlock">
    <h2>회비</h2>
    <dl>
      <dt>금액</dt><dd id="fee"></dd>
      <dt>계좌</dt><dd><div class="account"><span id="account"></span><button class="copy" type="button" id="copyBtn">복사</button></div><span class="note" id="holder"></span></dd>
    </dl>
  </div>

  <h2>참석 여부</h2>
  <a class="btn" id="rsvp" target="_blank" rel="noopener">참석 여부 알려주기</a>
</main>

<footer id="contact"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 여기만 고치면 됩니다 ===== */
const CONFIG = {
  boardDate: "○월 ○일 (○)",          // 칠판 오른쪽 날짜
  host: "윤규백",                      // 주번(진행자)
  letter: [
    "열일곱에 만난 우리가 내년이면 마흔이야.",
    "그냥 넘기기 아쉬워서 올해 모임은 조금 특별하게 준비했어.",
    "바빠도 이날만큼은 비워 두고 얼굴 보자."
  ],
  date: "2026년 ○월 ○일 ○요일",
  time: "저녁 ○시",
  place: "장소 이름",
  address: "주소",
  mapUrl: "",                          // 네이버/카카오 지도 링크, 없으면 비워두기
  showFee: true,                       // 회비 칸 숨기려면 false
  fee: "○만 원",
  account: "○○은행 000-0000-0000",
  holder: "예금주 ○○○",
  rsvpUrl: "",                         // 구글 폼 링크
  contact: "문의 윤규백 010-0000-0000"
};
/* ================================ */

const $ = id => document.getElementById(id);
$("boardDate").textContent = CONFIG.boardDate;
$("host").textContent = CONFIG.host;
CONFIG.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("letter").appendChild(p); });
$("date").textContent = CONFIG.date;
$("time").textContent = CONFIG.time;
$("place").textContent = CONFIG.place;
$("address").textContent = CONFIG.address;
if (CONFIG.mapUrl) $("map").href = CONFIG.mapUrl; else $("map").remove();
if (CONFIG.showFee) {
  $("fee").textContent = CONFIG.fee;
  $("account").textContent = CONFIG.account;
  $("holder").textContent = CONFIG.holder;
} else $("feeBlock").remove();
if (CONFIG.rsvpUrl) $("rsvp").href = CONFIG.rsvpUrl; else { $("rsvp").previousElementSibling.remove(); $("rsvp").remove(); }
$("contact").textContent = CONFIG.contact;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
const copyBtn = $("copyBtn");
if (copyBtn) copyBtn.addEventListener("click", async () => {
  const num = CONFIG.account.replace(/[^0-9-]/g, "");
  try { await navigator.clipboard.writeText(num); toast("계좌번호 복사됨"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=num; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("계좌번호 복사됨"); }catch(_){ toast("복사 실패. 길게 눌러서 복사해 줘"); }
    ta.remove();
  }
});
</script>
</body>
</html>
