<style>
  :root{
    --board:#264234; --board-2:#2d4c3c; --chalk:#f4f2e8;

    --paper:#fbfbf7; --ink:#24302a; --ink-soft:#5b665f; --rule:#dfe6ee;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:17px;line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .pen{font-family:"Nanum Pen Script",cursive;font-weight:400}

  /* 칠판 */
  .board{position:relative;background:
      radial-gradient(ellipse 60% 30% at 25% 30%,rgba(255,255,255,.06),transparent 70%),
      radial-gradient(ellipse 40% 25% at 70% 70%,rgba(255,255,255,.05),transparent 70%),
      linear-gradient(160deg,var(--board-2),var(--board));
    border:14px solid var(--wood);border-bottom-width:0;color:var(--chalk);padding:28px 24px 0}
  .board-inner{max-width:880px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start;min-height:360px}
  .headline{padding-top:12px}
  .headline h1{margin:0;font-size:clamp(80px,20vw,170px);line-height:.95;letter-spacing:-.01em}
  .headline p{margin:.25em 0 0;font-size:clamp(38px,9vw,64px);line-height:1.1}
  .underline{display:block;height:4px;width:min(420px,80%);margin-top:14px;background:var(--yellow);
    border-radius:2px;transform:rotate(-.6deg);opacity:.9}
  .side{border-left:2px solid rgba(201,209,200,.55);padding:8px 0 24px 20px;font-size:28px;line-height:1.35;min-width:150px}
  .side .date{color:var(--yellow);font-size:32px}
  .side .duty{margin-top:28px}
  .tray{height:30px;background:var(--wood);border-top:5px solid var(--wood-2);position:relative;margin:0 -24px}
  .tray span{position:absolute;bottom:22px;height:10px;border-radius:4px}
  .tray .c1{right:190px;width:56px;background:var(--chalk)}
  .tray .c2{right:120px;width:52px;background:var(--yellow)}
  .tray .er{right:24px;width:76px;height:20px;border-radius:3px;background:linear-gradient(#463e50 60%,#c8c8c8 60%)}

  /* 판서 등장 */
  .write{clip-path:inset(0 100% 0 0);animation:write 1.1s ease-out forwards}
  .write.d2{animation-delay:.55s}
  .underline.write{animation-delay:1.2s;animation-duration:.6s}
  @keyframes write{to{clip-path:inset(0 0 0 0)}}
  @media (prefers-reduced-motion:reduce){.write{animation:none;clip-path:none}}

  main{max-width:640px;margin:0 auto;padding:44px 24px 64px}
  .letter{font-size:18px;line-height:1.85;margin:0 0 44px;padding-bottom:36px;border-bottom:1px solid var(--rule)}
  .letter p{margin:0}
  h2{font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:34px;line-height:1.2;margin:0 0 14px}
  dl{margin:0 0 44px;display:grid;grid-template-columns:72px 1fr;row-gap:12px;column-gap:16px}
  dt{color:var(--ink-soft)}
  dd{margin:0}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--board);color:var(--chalk);
    padding:14px 18px;font-size:18px;margin:8px 0 44px;border-radius:6px}
  .btn:hover{background:var(--board-2)}
  .btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  footer{text-align:center;color:var(--ink-soft);font-size:15px;padding:0 24px 40px}

  /* 사진 갤러리 */
  .gallery{margin:0 0 48px}
  .hint{font-size:15px;color:var(--ink-soft);margin:0 0 12px}
  .track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;margin:0 -24px;padding:4px 24px 8px;scroll-padding:0 24px}
  .track::-webkit-scrollbar{display:none}
  .track:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .shot{flex:0 0 86%;scroll-snap-align:center;margin:0;background:#fff;padding:10px 10px 12px;
    border:1px solid #e4e6df;border-radius:3px;box-shadow:0 2px 8px rgba(36,48,42,.08)}
  .shot img{display:block;width:100%;aspect-ratio:4/5;object-fit:contain;background:#eef0ea}
  .gnav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .count{font-family:"Nanum Pen Script",cursive;font-size:26px;color:var(--ink-soft)}
  .arrows{display:flex;gap:8px}
  .arrows button{width:40px;height:40px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
    font-size:18px;line-height:1;border-radius:6px;cursor:pointer}
  .arrows button:disabled{opacity:.3;cursor:default}
  .arrows button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  @media (min-width:700px){.shot{flex-basis:62%}}

  @media (max-width:600px){
    .board{border-width:10px;border-bottom-width:0;padding:20px 18px 0}
    .board-inner{grid-template-columns:1fr;gap:4px;min-height:0}
    .side{border-left:0;border-top:2px solid rgba(201,209,200,.55);padding:12px 0 22px;display:flex;justify-content:space-between;align-items:baseline;font-size:24px}
    .side .date{font-size:26px}
    .side .duty{margin-top:0}
    .tray{margin:0 -18px}
    dl{grid-template-columns:60px 1fr}
  }
</style>

<body>

<header class="board">
  <div class="board-inner">
    <div class="headline pen">
      <h1 class="write">서른아홉,</h1>
      <p class="write d2">마지막으로 모이자</p>
      <span class="underline write" aria-hidden="true"></span>
    </div>
    <div class="side pen">
      <div class="date" id="boardDate"></div>
      <div class="duty"><span id="host"></span></div>
    </div>
  </div>
  <div class="tray" aria-hidden="true"><span class="c1"></span><span class="c2"></span><span class="er"></span></div>
</header>

<main>
  <section class="letter" id="letter"></section>

  <section class="gallery" aria-label="사진">
    <h2>그때 그 시절</h2>
    <p class="hint">옆으로 넘겨 보세요</p>
    <div class="track" id="track" tabindex="0"></div>
    <div class="gnav">
      <span class="count" id="count" aria-live="polite"></span>
      <div class="arrows"><button type="button" id="prev" aria-label="이전 사진">‹</button><button type="button" id="next" aria-label="다음 사진">›</button></div>
    </div>
  </section>

  <h2>언제, 어디서</h2>
  <dl>
    <dt>날짜</dt><dd id="date"></dd>
    <dt>일정</dt><dd id="time"></dd>
    <dt>장소</dt><dd id="place"></dd>
  </dl>

  <h2>되는 주말 알려줘</h2>
  <a class="btn" id="rsvp" target="_blank" rel="noopener">날짜 투표하기</a>
</main>

<footer id="contact"></footer>

<script>
/* ===== 여기만 고치면 됩니다 ===== */
const CONFIG = {
  boardDate: "11~12월 주말",
  host: "",
  letter: [
    "열일곱에 만난 우리가 내년이면 마흔이야.",
    "그 전에 30대로 모이는 마지막 자리를 만들려고 해.",
    "1박 2일로 갈 거니까, 되는 주말부터 알려줘."
  ],
  date: "11~12월 중",
  time: "토요일 ~ 일요일, 1박 2일",
  place: "깊이 고민 중",
  rsvpUrl: "https://forms.gle/N2c2xZauFpzaYEnj7",
  contact: "",
  photos: [                           // img 폴더 사진 파일 이름, 넘기는 순서대로
    "20220408_034901.jpeg",
    "20220408_051051.jpeg",
    "20220218_013410.png",
    "20220218_012216.jpeg",
    "20220218_012940.png",
    "20220217_110038.png",
    "20210826_084035.jpg",
    "20210731_093600.jpeg",
    "20210429_110030.jpg",
    "20210421_105710.jpg",
    "20201011_022821.jpg",
    "20200712_032852.jpeg",
    "20200606_052736.jpg",
    "20200523_050544 (4).jpeg",
    "20200523_050544 (3).jpeg",
    "20200523_050544 (2).jpeg",
    "20200523_050544 (1).jpeg",
    "20200523_050544.jpeg",
    "20200517_103543.jpg",
    "20200411_082450.jpg",
    "20200303_105337.jpg",
    "20190120_040606.jpg",
    "20180121_101108 (1).jpeg",
    "20180121_101108.jpeg",
    "P20170925_131058124_122A3940-78F6-4509-9E3B-B10EFB9BD136.JPG",
    "P20151116_201119000_7B1F3576-7F02-40E1-929C-1C3272640596.JPG",
    "P20151116_201015000_1C71088C-2FC0-4696-BA62-5D1CF8CCEE13.JPG",
    "P20150830_010323875_AE4E0970-D57C-473A-B743-B19F63E0E253.JPG",
  ],
};
/* ================================ */

const $ = id => document.getElementById(id);
$("boardDate").textContent = CONFIG.boardDate;
$("host").textContent = CONFIG.host;
CONFIG.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("letter").appendChild(p); });
$("date").textContent = CONFIG.date;
$("time").textContent = CONFIG.time;
$("place").textContent = CONFIG.place;
$("rsvp").href = CONFIG.rsvpUrl;
$("contact").textContent = CONFIG.contact;

// 사진 갤러리
const track = $("track"), shots = [];
let cur = 0;
function update(){
  if (!shots.length) { track.closest(".gallery").remove(); return; }
  $("count").textContent = `${cur + 1} / ${shots.length}`;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === shots.length - 1;
}
CONFIG.photos.forEach((name, k) => {
  const f = document.createElement("figure"); f.className = "shot";
  const im = document.createElement("img");
  im.src = "img/" + encodeURIComponent(name); im.alt = `사진 ${k + 1}`;
  if (k > 1) im.loading = "lazy";
  im.onerror = () => { const j = shots.indexOf(f); if (j > -1) shots.splice(j, 1); f.remove(); cur = Math.max(0, Math.min(cur, shots.length - 1)); update(); };
  f.appendChild(im); track.appendChild(f); shots.push(f);
});
track.addEventListener("scroll", () => {
  const mid = track.scrollLeft + track.clientWidth / 2; let best = 0, bd = 1e9;
  shots.forEach((el, i) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - track.offsetLeft - mid); if (d < bd) { bd = d; best = i; } });
  if (best !== cur) { cur = best; update(); }
}, { passive: true });
function go(i){
  i = Math.max(0, Math.min(shots.length - 1, i)); cur = i; update();
  const el = shots[i];
  track.scrollTo({ left: el.offsetLeft - track.offsetLeft - (track.clientWidth - el.offsetWidth) / 2, behavior: "smooth" });
}
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
track.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});
update();
</script>
</body>

/* ================================ */

const $ = id => document.getElementById(id);
$("boardDate").textContent = CONFIG.boardDate;
$("host").textContent = CONFIG.host;
CONFIG.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("letter").appendChild(p); });
$("date").textContent = CONFIG.date;
$("time").textContent = CONFIG.time;
$("place").textContent = CONFIG.place;
$("rsvp").href = CONFIG.rsvpUrl;
$("rsvpNote").textContent = CONFIG.rsvpNote;
$("contact").textContent = CONFIG.contact;

// 사진 갤러리
const track = $("track"), shots = [];
let cur = 0;
function update(){
  if (!shots.length) { track.closest(".gallery").remove(); return; }
  $("count").textContent = `${cur + 1} / ${shots.length}`;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === shots.length - 1;
}
CONFIG.photos.forEach((name, k) => {
  const f = document.createElement("figure"); f.className = "shot";
  const im = document.createElement("img");
  im.src = "img/" + encodeURIComponent(name); im.alt = `사진 ${k + 1}`;
  if (k > 1) im.loading = "lazy";
  im.onerror = () => { const j = shots.indexOf(f); if (j > -1) shots.splice(j, 1); f.remove(); cur = Math.max(0, Math.min(cur, shots.length - 1)); update(); };
  f.appendChild(im); track.appendChild(f); shots.push(f);
});
track.addEventListener("scroll", () => {
  const mid = track.scrollLeft + track.clientWidth / 2; let best = 0, bd = 1e9;
  shots.forEach((el, i) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - track.offsetLeft - mid); if (d < bd) { bd = d; best = i; } });
  if (best !== cur) { cur = best; update(); }
}, { passive: true });
function go(i){
  i = Math.max(0, Math.min(shots.length - 1, i)); cur = i; update();
  const el = shots[i];
  track.scrollTo({ left: el.offsetLeft - track.offsetLeft - (track.clientWidth - el.offsetWidth) / 2, behavior: "smooth" });
}
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
track.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});
update();
</script>
